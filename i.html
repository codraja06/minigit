<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #121a2d;
        --card: rgba(17, 24, 39, 0.85);
        --card-border: rgba(148, 163, 184, 0.2);
        --text: #e5eefb;
        --muted: #9aa7bd;
        --primary: #6ea8fe;
        --primary-strong: #3b82f6;
        --secondary: #1f2a3d;
        --success: #34d399;
        --shadow: rgba(15, 23, 42, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #16213d 0%, var(--bg) 45%, #090d17 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-shell {
        width: min(100%, 430px);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        box-shadow: 0 24px 80px var(--shadow);
        backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: var(--text);
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        display: grid;
        place-items: center;
        box-shadow: 0 12px 28px rgba(110, 168, 254, 0.55);
        font-size: 1rem;
      }

      .content {
        padding: 20px 28px 28px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 2.4rem);
        line-height: 1.1;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.98rem;
      }

      form {
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.82rem;
        font-weight: 600;
        color: #dfe9fb;
      }

      input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 14px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      input:focus {
        border-color: rgba(110, 168, 254, 0.85);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: -2px;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .checkbox input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary-strong);
      }

      .link {
        color: var(--primary);
        text-decoration: none;
        font-size: 0.88rem;
      }

      .link:hover {
        text-decoration: underline;
      }

      .primary-btn {
        margin-top: 8px;
        border: none;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white;
        border-radius: 12px;
        padding: 15px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 16px 30px rgba(59, 130, 246, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 34px rgba(59, 130, 246, 0.46);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.78rem;
        margin: 6px 0 10px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(148, 163, 184, 0.2);
      }

      .socials {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .social-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.45);
        color: var(--text);
        padding: 12px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      .social-btn .icon {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        font-size: 0.72rem;
      }

      .footer {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .content {
          padding-left: 18px;
          padding-right: 18px;
        }

        .socials {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="card" aria-label="Login form">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark">M</span>
            <span>MiniGit</span>
          </div>
          <span>Welcome back</span>
        </div>

        <div class="content">
          <p class="eyebrow">Account access</p>
          <h1>Log in</h1>
          <p class="subtitle">Sign in to continue to your workspace and projects.</p>

          <form>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="Enter your password" />
            </div>

            <div class="row">
              <label class="checkbox">
                <input type="checkbox" name="remember" />
                <span>Remember me</span>
              </label>
              <a class="link" href="#">Forgot password?</a>
            </div>

            <button class="primary-btn" type="submit">Sign in</button>
          </form>

          <div class="divider">or continue with</div>

          <div class="socials">
            <button class="social-btn" type="button"><span class="icon">G</span>Google</button>
            <button class="social-btn" type="button"><span class="icon">H</span>GitHub</button>
          </div>

          <div class="footer">
            Don’t have an account? <a href="#">Create one</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
